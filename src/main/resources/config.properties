# reshmamart Application Configuration
db.url=jdbc:h2:file:./data/reshmamart;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.user=sa
db.password=

# HikariCP Pool settings
db.pool.maximum=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.maxLifetime=1800000
db.pool.connectionTimeout=10000

# Application Settings
app.name=reshmamart
server.port=8085
session.timeout.minutes=30

# AI Chatbot Configuration (Section 11 / Phase 3)
ai.chatbot.provider=mock
ai.chatbot.gemini.key=
ai.chatbot.rate.limit=10

